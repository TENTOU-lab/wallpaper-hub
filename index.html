<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>鹤临壁纸仓库</title><style>* {box-sizing:border-box}
body {margin:0;color:#1d1c25;background:#fff3cf;font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main {width:100%;max-width:660px;margin:auto;padding:0 18px 24px}
header,footer,.folio,.samples,.resulthead {display:flex;align-items:center;justify-content:space-between}
header {min-height:56px;border-bottom:2px solid currentColor;margin-bottom:14px}
header b {font-size:16px}.mark {font-size:21px;color:#bc3328}.edition,.folio,footer,.tab,.mast small,figcaption,.resulthead b {font-family:"Courier New",monospace;font-weight:bold;letter-spacing:.06em}
.edition {font-size:12px}
.cover {position:relative;margin:0 0 24px}
.pop {background-color:#ffefb9;background-image:radial-gradient(#e5c775 1px,transparent 1px);background-size:6px 6px}
.popcover {border:3px solid #211c27;background:#ffe235;box-shadow:5px 5px #211c27;transform:rotate(-1deg)}
.scene {position:relative;border-bottom:3px solid #211c27;overflow:hidden;background:#3065dc}
.scene > svg {display:block;width:100%;height:150px;object-fit:cover}
.scene i {position:absolute;right:5%;top:10%;font-size:24px;background:#fff9e9;border:3px solid;border-radius:60% 55% 60% 16%;padding:0 10px;transform:rotate(9deg);font-weight:900}
.mast {padding:8px 14px 14px}.mast small,.magtitle small {font-size:11px;letter-spacing:.16em}
h1,h2,p,figure {margin:0}
.mast h1 {font-size:clamp(34px,10.4vw,64px);font-weight:1000;line-height:1.15;letter-spacing:-.06em;text-shadow:2px 2px #fff4d2,4px 4px #f26950}
.lookup {position:relative;background:#fffaf1;border:3px solid;padding:19px 14px 5px;box-shadow:4px 4px #211c27}
.tab {position:absolute;top:-12px;right:12px;background:#ff8069;padding:0 8px;border:2px solid;font-size:11px;transform:rotate(3deg)}
label {display:block;font-size:22px;font-weight:800}.lookup p {margin:2px 0 12px;font-size:14px}.field {display:flex;align-items:center;position:relative}
.lens {position:absolute;left:15px;pointer-events:none;width:15px;height:15px;border:2px solid;border-radius:50%}.lens:after {content:"";position:absolute;left:10px;top:11px;width:8px;height:2px;transform:rotate(45deg);background:currentColor}
input {appearance:none;-webkit-appearance:none;width:100%;min-width:0;border:2px solid #231f29;background:white;border-radius:2px;padding:11px 10px 11px 42px;color:#211c27;font:500 18px/24px system-ui,sans-serif}
:focus {outline:3px solid #215ec6;outline-offset:3px}
.samples {justify-content:flex-start;gap:10px;font-size:12px;color:#494548}.samples button {min-height:44px;padding:0 3px;color:#324b83;border:0;background:none;text-decoration:underline;text-underline-offset:3px;font:600 13px monospace;cursor:pointer}
.matches {margin-top:20px}.matches h2 {font-size:14px;letter-spacing:.05em;margin-bottom:8px}.matches h2:before {content:"✦";margin-right:7px}
article {background:#fff9e9;border:2px solid;padding:12px 14px;margin-bottom:12px;box-shadow:3px 3px #211c27}
.resulthead b {font-size:12px;background:#ffe235;padding:1px 5px;border:1px solid}.resulthead small {font-size:12px}.result-title {margin:5px 0 10px;font-size:20px}
.claim {background:#2348ac;color:white;display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:8px 12px;border:2px solid #211c27;text-decoration:none;font-weight:bold}.claim span {font-size:21px}
.claim:hover {background:#173476}.claim:active,.samples button:active {background-color:#51482e;color:white}
footer {justify-content:center;gap:10px;border-top:1px solid;margin-top:24px;padding:12px;font-size:10px;letter-spacing:.15em}
.zine {background-color:#eae2ce;background-image:repeating-linear-gradient(95deg,transparent 0 4px,#d8d0bd55 4px 5px);color:#282820}
.zine header {border-bottom:3px double}.zine .edition {color:#923b30}
.magazine {background:#f9f3e4;border:1px solid #39362c;padding:9px 12px 16px;min-height:210px;box-shadow:3px 4px #b4a994;isolation:isolate}
.folio {font-size:11px;border-bottom:1px solid;padding-bottom:4px}.folio span {font-size:9px}
.magtitle {padding:12px 0 0 7px}.magtitle small {background:#272820;color:#fff5d9;padding:2px 5px}
.magtitle h1 {font:900 55px/.99 "Songti SC",SimSun,serif;letter-spacing:-.09em;transform:rotate(-3deg);transform-origin:left; margin-top:6px}.magtitle h1 span {color:#a84331}
.magazine figure {position:absolute;right:5%;top:36px;width:42%;height:163px;border:1px solid #585349;background:#fff9e8;transform:rotate(5deg);padding:4px;box-shadow:2px 2px #817868}
figure svg {display:block;width:100%;height:calc(100% - 15px);background:#e8dfcb}figcaption {font-size:9px;line-height:15px;text-align:center}
figure:before,.zine .lookup:before {content:"";position:absolute;top:-6px;left:30%;width:40%;height:13px;transform:rotate(-8deg);background:#d7bb77cc;clip-path:polygon(2% 2%,98% 0,95% 23%,100% 51%,97% 72%,100% 100%,0 96%,3% 66%,0 40%)}
.stamp {position:absolute;left:42%;bottom:15px;border:3px double #a44332;color:#a44332;font:700 14px/1.2 SimSun,serif;padding:3px;transform:rotate(-9deg)}
.zine .lookup {background:#fbf7e9;border:1px solid #464336;box-shadow:2px 3px #aea28c;padding-top:15px}
.zine .lookup:before {left:10px;top:-8px;width:48px}.zine .tab {background:#f8edc7;color:#842f22;transform:rotate(-3deg);border:1px solid}
.zine label,.zine .result-title {font-family:"Songti SC",SimSun,serif}.zine input {border:1.5px solid;background:#fffdf3}.zine article {position:relative;border:1px solid #403e35;border-left:5px solid #a94736;box-shadow:2px 3px #b4a995}
.zine .resulthead b {background:transparent;color:#8c3326;border:1px dashed}.zine .claim {background:#383b31;border:1px solid #292a24}.zine .claim:hover {background:#505342}
@media(min-width:720px){main {padding-top:14px}.scene > svg {height:200px}.magazine {min-height:260px}.magazine figure {width:39%;height:212px}.magtitle h1 {font-size:77px}.lookup {padding:20px 24px 8px}}
@media(prefers-reduced-motion:no-preference){article {transition:opacity .17s ease-out,transform .21s cubic-bezier(.2,.9,.3,1.18)}@starting-style{article {opacity:.3;transform:translateY(4px) scale(.985)}}.claim:active {transform:translateY(1px)}}

        .scene svg.wind {position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
        .scene svg[viewBox] {position:relative}
        .wind-toggle {display:none}
        .gust {opacity:0}
        @media (prefers-reduced-motion:no-preference) {
          .wind-ready .wind-toggle {display:inline-grid;place-items:center;width:44px;height:44px;padding:0;background:transparent;border:0;color:#292723;cursor:pointer}
          .wind-toggle span {display:grid;place-items:center;width:23px;height:23px;border:1px solid;border-radius:50%;font:700 12px/1 sans-serif}
          .wind-ready .wind-streaks {animation:passing-wind 3.6s linear infinite}
          .wind-ready .gust {animation:wind-gust 2s linear .45s infinite}
          .wind-ready .gust-short {animation-delay:.53s}
          .wind-ready .gust-low {animation-delay:.61s}
          .wind-paused .wind-streaks,.wind-paused .gust {animation-play-state:paused}
        }
        /* One 274-unit tile along the pattern's rotated horizontal axis. */
        @keyframes passing-wind {to {transform:translate(-260.589px,84.671px)}}
        @keyframes wind-gust {
          0% {transform:translate(0,0);opacity:0}
          3% {opacity:.96}
          18% {opacity:.96}
          25%,100% {transform:translate(-270px,87.7px);opacity:0}
        }

const field = document.getElementById('serial');
const statusText = document.getElementById('status');
const results = document.getElementById('results');
function element(tag, text, cssClass) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (cssClass) node.className = cssClass;
  return node;
}
function searchRows(query) {
  const exact = [], partial = [];
  wallpaperData.forEach(row => {
    const id = row.id.toLowerCase();
    if (id === query) exact.push(row);
    else if (id.includes(query) || row.title.toLowerCase().includes(query)) partial.push(row);
  });
  return exact.concat(partial);
}
function render() {
  const query = field.value.trim().toLowerCase();
  const section = results.parentElement;
  section.hidden = !query;
  if (!query) {
    results.textContent = '';
    statusText.textContent = '';
    return;
  }
  const rows = searchRows(query);
  statusText.textContent = '查询结果 · ' + rows.length + ' 条';
  const fragment = document.createDocumentFragment();
  if (!rows.length) fragment.appendChild(element('p', '没有找到这张壁纸。检查序列号，或只输入其中几位数字。'));
  rows.forEach(row => {
    const card = document.createElement('article');
    const header = element('div', '', 'resulthead');
    header.appendChild(element('b',row.id));
    const label = row.id.toLowerCase() === query ? '精确匹配' : '相关匹配';
    header.appendChild(element('small', label));
    card.appendChild(header);
    card.appendChild(element('h3',row.title,'result-title'));
    const link = element('a','去百度网盘领取','claim');
    link.href = row.link;
    link.setAttribute('aria-label','去百度网盘领取 ' + row.id + ' ' + row.title);
    const arrow = element('span','↗');
    arrow.setAttribute('aria-hidden','true');
    link.appendChild(arrow);
    card.appendChild(link);
    fragment.appendChild(card);
  });
  results.textContent = '';
  results.appendChild(fragment);
}
field.addEventListener('input', render);
document.querySelectorAll('.samples button').forEach(button => {
  button.addEventListener('click', () => {field.value = button.textContent; render();});
});
render();

          windControl.setAttribute('aria-label', label);
          windControl.title = label;
          windControl.firstElementChild.textContent = paused ? '▶' : 'Ⅱ';
        });
        document.body.classList.add('wind-ready');
