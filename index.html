*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#555984;color:#262d40;font:16px/1.4 "Microsoft YaHei","PingFang SC",sans-serif}
#street{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;isolation:isolate;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#street-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
#world{position:relative;width:min(100%,82vh,680px);width:min(100%,82svh,680px);aspect-ratio:320/360;container-type:inline-size}
#stage{width:100%;height:auto}
#machine{position:absolute;inset:0;transform:translateX(15%)}
#actor{position:absolute;inset:0;width:100%;height:auto;pointer-events:none}
h1,.lcd,#pad,#start,#quick,#message{position:absolute;margin:0}
h1{left:8%;top:13.4%;width:72%;font-size:20px;font-size:5.8cqw;line-height:1.3;color:#274c4c;letter-spacing:.04em}
h1 small{display:block;font:bold 2.1cqw/1.3 monospace;letter-spacing:.22em;color:#597568}
.lcd{left:45%;top:24%;width:34%;height:14.2%;display:flex;flex-direction:column;justify-content:center;background:#192e37;color:#c8f7aa;padding:1cqw 1.8cqw;box-shadow:inset 0 2px #11202d}
.lcd label,.lcd b{font-size:11px;font-size:clamp(10px,2.75cqw,15px);line-height:1.1}
.lcd b{font-family:monospace;margin-top:2px;color:#b4d99e}
#serial{background:#304449;border:0;border-bottom:1px solid #769c7e;padding:1px 2px;color:#eeffcd;width:100%;font:bold max(16px,4cqw)/1.2 monospace;border-radius:0;min-width:0}
#serial::placeholder{color:#b0bf9f}#serial:focus{outline:2px solid #dbf4a4}
#pad{left:45%;top:39%;width:34%;height:24%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:0}
button,a{font-family:inherit;cursor:pointer}#pad button{color:transparent;background:transparent;border:0;padding:0}
#start,#quick{left:45%;width:34%;font-weight:bold;border:2px solid #33484c;box-shadow:2px 2px #697674;font-size:clamp(13px,3.4cqw,19px);padding:0}
#start{top:65%;height:8%;background:#b9db93;color:#20392e}#quick{top:75%;height:7%;background:#e2e4d8;color:#304746}
h1,h1 small,.lcd label,.lcd b,#serial,#start,#quick{font-family:StationPixel,"Microsoft YaHei",sans-serif;font-weight:400;font-synthesis:none}
h1{top:13%;font-size:24px;line-height:1;letter-spacing:0}
h1 small{font-size:12px;line-height:1;letter-spacing:0}
.lcd label,.lcd b{font-size:12px;line-height:1}
#start,#quick{font-size:18px;white-space:nowrap;line-height:1}
@container (min-width:405px){#start,#quick{font-size:24px}}
@container (min-width:505px){h1{font-size:36px}.lcd b{font-size:18px}}
button:disabled{cursor:default}#start:disabled{background:#bac8ac}
#message{left:6%;width:88%;top:90%;padding:.45em .7em;background:#273044ed;color:#fff5dc;border-left:4px solid #a6d797;text-align:center;font-size:clamp(13px,3.5cqw,18px)}
:focus-visible{outline:3px solid #eeae58;outline-offset:1px}
#overlay{position:fixed;inset:0;z-index:3;display:grid;align-items:center;justify-items:center;padding:16px;background:#1f243a85}
#overlay section{background:#fff6df;color:#242d3a;border:3px solid #253346;box-shadow:5px 5px #172638;max-height:82vh;overflow:auto;width:min(100%,420px);padding:20px}
#overlay h2{margin:0 0 8px;font-size:23px}.tag,#ticket-id{font-weight:bold;color:#365e4b}#overlay button,#open{display:block;border:2px solid #293948;padding:10px;background:#efe9d8;font-size:15px;color:#212e33;font-weight:bold;min-height:44px}
#open{background:#bbdfa0;text-align:center;text-decoration:none;margin-bottom:12px}.buttons{display:flex;gap:8px}.buttons button{flex:1}#list{max-height:48vh;overflow:auto;display:grid;gap:6px;margin-bottom:10px}#list button{text-align:left}#back,#url{width:100%}#feedback:empty{display:none}
@media(prefers-reduced-motion:no-preference){#world[data-state=search] .lcd{animation:scan .32s ease-in-out 2 alternate}@keyframes scan{to{background:#3c564b}}}
@media(max-height:470px){#world{width:min(100%,385px)}#street{min-height:100vh}#overlay section{max-height:92vh}}

</script><script>/* Integer coordinates keep cabinet parts, sprite poses and parcels on one pixel grid. */
const stationScene = (() => {

  function pickupMark(){
    let x=41;

      if(letter===' '){x+=6;continue;}
      portLetters[letter].forEach((bits,row)=>{
        for(let col=0;col<5;col++){
          if(bits & (16>>col))rect(x+2*col,246+2*row,2,2,'#324f4e');
        }
      });

  }
  function pixelLine(x,y,dx,dy,n,color) {
    for(let i=0;i<n;i++) rect(x+dx*i,y+dy*i,2,1,color);
  }
  function background() {
    rect(0,0,320,196,'#555984');
    for(let i=0;i<4;i++) rect(0,16+i*12,320,13,['#70739b','#8987aa','#aaa0b8','#c4aec0'][i]);
    rect(260,7,13,13,'#ffdf9e');rect(257,10,19,7,'#ffdf9e');
    for(let i=0;i<24;i++)rect(i*43%316,i*17%38,1,1,'#f8dfc5');

      const y=43+(i*17)%23,x=i*24-8;
      rect(x,y,23,62,'#686b8b');rect(x+2,y-3,10,3,'#686b8b');
      for(let k=0;k<8;k++)rect(x+4+k%3*6,y+6+Math.floor(k/3)*9,3,4,k%3?'#9593ab':'#e9cba5');
    }
    // Shopfront, hanging curtain and tiled pavement behind the machine.
    rect(0,64,76,108,'#384457');rect(0,68,71,14,'#f1ce9c');label('K I S S A',5,78,'#685663',7);
    rect(0,83,78,5,'#283447');rect(4,89,59,60,'#91786f');
    for(let i=0;i<5;i++){rect(i*14,87,13,27-i%2*3,'#984c59');rect(i*14,89,12,3,'#c57772');}
    rect(5,116,23,25,'#dca779');rect(32,116,25,25,'#c99173');rect(0,142,65,5,'#272e44');
    rect(264,69,56,99,'#627078');rect(266,73,54,6,'#86918e');
    for(let y=84;y<160;y+=6)rect(268,y,52,2,'#515c6c');
    rect(286,30,4,142,'#3b4056');rect(281,36,15,3,ink);
    for(let i=0;i<160;i++){let x=i*2;rect(x,19+Math.sin(i/160*Math.PI)*19,2,1,'#41455d');rect(x,23+Math.sin(i/160*Math.PI)*20,2,1,'#515168');}

    for(let i=0;i<10;i++){pixelLine(i*41,172,-.4,1,12,'#767385');rect(i*41+5,175,11,1,'#b9a3a8');}
    for(let i=0;i<4;i++){rect(254+i*4,157-i%2*5,5,13,'#537c6d');rect(256+i*4,155-i%2*5,3,7,'#86a87e');}
    rect(252,169,21,4,'#c08472');rect(254,173,17,7,'#966b66');
  }
  function parcel(x,y,index,opened=false) {

    rect(x,y,14,12,ink);rect(x+1,y+1,12,9,color);rect(x+2,y+1,10,2,'#fff0c8');

  }
  const clips = {
  "idle": {
    "row": 0,
    "ms": [
      600,
      360,
      110,
      410
    ]
  },
  "look": {
    "row": 1,
    "ms": [
      110,
      100,
      220,
      190
    ]
  },
  "walk": {
    "row": 2,
    "ms": [
      100,
      90,
      100,
      100,
      90,
      100
    ]
  },
  "pickup": {
    "row": 3,
    "ms": [
      90,
      110,
      100,
      130,
      150
    ]
  },
  "hold": {
    "row": 4,
    "ms": [
      180,
      340,
      380
    ]
  },
  "open": {
    "row": 5,
    "ms": [
      120,
      100,
      85,
      105,
      210
    ]
  },
  "success": {
    "row": 6,
    "ms": [
      100,
      90,
      150,
      90,
      240
    ]
  },
  "error": {
    "row": 7,
    "ms": [
      140,
      130,
      260,
      220
    ]
  }
};
  const slot = i => ({x:34+(i%3)*36,y:99+Math.floor(i%9/3)*43});
  const keys=['1','2','3','4','5','6','7','8','9','-','0','⌫'];
  function keyPoint(i){return {x:144+(i%3+.5)*108.8/3,y:140.4+(Math.floor(i/3)+.5)*21.6};}
  function cabinet(state,item,index,p,pressed){
    rect(16,40,253,279,ink);rect(19,37,246,3,ink);rect(19,40,245,274,'#dcded1');
    rect(264,43,5,271,'#8b9995');rect(21,41,240,3,'#fff7dd');rect(24,319,15,5,ink);rect(245,319,14,5,ink);
    rect(23,46,236,35,'#f5f1da');rect(23,78,236,3,'#91b9a6');rect(23,84,115,149,ink);
    rect(26,87,109,143,'#3c5260');rect(26,87,109,4,'#c7ffe0');
    rect(141,84,115,216,'#aebbb2');
    const page=Math.floor(index/9)*9;
    for(let k=0;k<9;k++){
      const a=slot(k),num=page+k, chosen=item&&num===index;
      if(chosen&&state==='match')rect(a.x-3,a.y-4,28,25,'#d8fa99');
      if(catalog[num]&&!(chosen&&['dispensing','taking','holding','opening','celebrating','done'].includes(state))){
        ctx.save();ctx.translate(a.x,a.y);ctx.scale(1.5,1.5);parcel(0,0,num);ctx.restore();
      }
      rect(a.x-6,a.y+21,35,4,'#9caeb1');
    }
    rect(27,279,105,39,'#a5b1a8');rect(30,282,99,35,ink);rect(33,285,93,31,'#394756');
    rect(31,315,97,3,'#86948d');pickupMark();
    for(let k=0;k<12;k++){
      const a=keyPoint(k),x=Math.round(a.x)-16,y=Math.round(a.y)-9;
      rect(x,y,32,18,ink);rect(x+1,y+1,30,14,k===pressed?'#ffda80':'#ebeadc');
      label(keys[k],x+3,y+12,ink,11);
      label(['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ','','',''][k],x+13,y+12,'#556466',5);
    }
    for(let k=0;k<11;k++)rect(27+k*8,267,5,2,'#859791');
    if(state==='dispensing'){
      const s=slot(index), t=Math.max(0,(p-.15)/.85);
      const x=s.x+(dropX(index)-s.x)*t;
      const y=s.y+(300-s.y)*t*t;
      const scale=1.5+.5*t;
      const sheet=colorSheet(index);
      if(sheet)ctx.drawImage(sheet,44,3*80+62,14,10,Math.round(x),Math.round(y),Math.round(14*scale),Math.round(10*scale));
      else parcel(x,y,index);
    }
  }
  const atlas=document.getElementById('clerk-sprite'),actor=document.getElementById('actor').getContext('2d');
  const sheets=new Map();
  const dropX=index=>Math.min(98,slot(index).x+3);
  // Only the parcel palette changes. Costumes and skin keep their original colours.
  function colorSheet(index){
    if(!atlas.complete||!atlas.naturalWidth)return null;
    const key=index%colors.length;
    if(!key)return atlas;
    if(sheets.has(key))return sheets.get(key);
    const c=document.createElement('canvas');c.width=atlas.naturalWidth;c.height=atlas.naturalHeight;
    const g=c.getContext('2d');g.drawImage(atlas,0,0);
    try{
      const data=g.getImageData(0,0,c.width,c.height),pixels=data.data;
      const rgb=parseInt(colors[key].slice(1),16),base=[rgb>>16,(rgb>>8)&255,rgb&255];
      const tones=new Map([[0xe79770,base],[0xc26d5c,base.map(v=>Math.round(v*.74))],
        [0xffd093,base.map(v=>Math.round(v+(255-v)*.49))]]);

        const replacement=tones.get((pixels[i]<<16)|(pixels[i+1]<<8)|pixels[i+2]);
        if(replacement)pixels.set(replacement,i);

  }

  const lengths=Object.fromEntries(Object.entries(clips).map(([name,clip])=>[name,clip.ms.reduce((a,b)=>a+b,0)]));
  let current='idle',item=null,start=0,duration=0,activeKey=-1,keyTime=-1000,wake=0;
  const homeX=36, floor=324, machineX=48;
  function paint(){
    clearTimeout(wake);
    if(document.hidden)return;
    const now=performance.now(),elapsed=Math.max(0,now-start);
    const pressed=current==='idle'&&now-keyTime<240?activeKey:-1;
    const action=pressed>=0?'look':actionFor[current];
    const clip=clips[action],length=lengths[action];
    const progress=duration?Math.min(1,elapsed/duration):1;
    const loops=current==='idle'&&pressed<0;
    let time=loops?elapsed%length:duration?progress*length:Math.min(elapsed,length);
    if(current==='done'||reduce.matches)time=loops?0:length-1;
    let col=0,next=clip.ms[0];
    while(col<clip.ms.length-1&&time>=next)next+=clip.ms[++col];
    const index=Math.max(0,catalog.indexOf(item)),dest=machineX+dropX(index)-20;
    const atPort=['taking','holding','opening','celebrating','done'].includes(current);
    const x=current==='dispensing'?Math.round(homeX+(dest-homeX)*progress):atPort?dest:homeX;
    ctx.clearRect(0,0,320,360);cabinet(current,item,index,progress,pressed);
    actor.clearRect(0,0,320,360);actor.imageSmoothingEnabled=false;
    const sheet=colorSheet(index);
    if(sheet){
      actor.fillStyle='#736d80';actor.fillRect(x-16,floor-2,34,4);
      actor.drawImage(sheet,col*80,clip.row*80,80,80,x-68,floor-148,160,160);
    }
    if(pressed>=0)wake=setTimeout(paint,Math.max(1,241-(now-keyTime)));
    else if(!reduce.matches && current==='dispensing'&&progress<1)wake=setTimeout(paint,25);
    else if(!reduce.matches&&(loops||time<length && col<clip.ms.length-1)){
      wake=setTimeout(paint,Math.max(1,(next-time)*(duration?duration/length:1)));
    }
  }
  function repaint(){paint();}
  function show(state,row,ms=0){
    current=state;item=row;duration=ms;start=performance.now();activeKey=-1;paint();
  }
  function tap(key){
    const groups=['1','2ABC','3DEF','4GHI','5JKL','6MNO','7PQRS','8TUV','9WXYZ','-','0','⌫'];
    activeKey=groups.findIndex(group=>group.includes(key.toUpperCase()));
    keyTime=performance.now();paint();
  }

  function scenery(){
    const bg=document.getElementById('street-art'),street=document.getElementById('street'),world=document.getElementById('world');
    const scale=world.clientWidth/320;
    bg.width=Math.ceil(street.clientWidth/scale);bg.height=Math.ceil(street.clientHeight/scale);
    ctx=bg.getContext('2d');
    const ground=Math.round((bg.height-360)/2+306),skyTop=ground-340;
    rect(0,0,bg.width,bg.height,'#555984');rect(0,ground,bg.width,bg.height-ground,'#8b8494');

    ctx=canvas.getContext('2d');
  }

  document.addEventListener('visibilitychange',repaint);
  reduce.addEventListener?.('change',repaint);

})();
</script><script>const byId = id => document.getElementById(id);
const field = byId('serial'), form = byId('lookup');
const primary = byId('start'), quick = byId('quick'), motion = matchMedia('(prefers-reduced-motion: reduce)');
let state = 'idle', selected = null, matches = [], fast = false, timer = 0, version = 0;
const phases = {
  idle:['READY','轻点机身屏幕输入序列号'],search:['CHECK…','正在核对序列号…'],choices:['SELECT','请选择对应的壁纸'],
  match:['OK ✓','匹配成功'],dispensing:['OK · DROP','ガコン！盒子正在落下'],
  taking:['PICK UP','少年正在拾取盒子'],holding:['HOLD','接到壁纸盒了'],opening:['OPENING','パカッ！盒盖打开了'],
  celebrating:['OK ✓','拿到壁纸卡了'],
  done:['OK','领取卡已打开'],miss:['NO','未找到对应壁纸，请检查序列号']
};
function phase(next,duration=0) {
  state=next;
  byId('world').dataset.state=next;
  const [code,message]=phases[next];
  byId('code').textContent=code;
  byId('message').textContent=next==='match'?message+' · '+selected.id+' · '+selected.title:message;
  primary.disabled=!['idle','miss'].includes(next);
  primary.textContent='确认取货 ▸';
  quick.textContent=['idle','done','miss','choices'].includes(next)?'直接领取':'跳过动画';
  byId('options').hidden=next!=='choices';
  byId('ticket').hidden=next!=='done';
  byId('overlay').hidden=!['choices','done'].includes(next);
  byId('world').inert=!byId('overlay').hidden;
  stationScene.show(next,selected,duration);
}
function cancel(){
  clearTimeout(timer);
  version++;
}
function after(ms,callback){
  const run=version;
  timer=setTimeout(()=>{if(run===version)callback();},motion.matches?0:ms);
}
function clearQuery(){
  cancel(); selected=null; matches=[]; fast=false;
  field.setAttribute('aria-invalid','false');field.removeAttribute('aria-describedby');
  byId('feedback').textContent='';byId('manual').hidden=true;
  byId('list').textContent='';byId('open').removeAttribute('href');byId('url').value='';
  phase('idle');
}
function fail(message){
  field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','message');
  phase('miss');byId('message').textContent=message;
}
function reveal(){
  cancel();
  byId('name').textContent=selected.title;byId('ticket-id').textContent=selected.id;
  byId('open').href=selected.link;byId('url').value=selected.link;
  phase('done');byId('name').focus();
}
function choose(row){
  selected=row;
  if(fast){reveal();return;}
  const sequence=[['match',320],['dispensing',540],['taking',460],['holding',240],['opening',440],['celebrating',360]];
  function play(step){
    if(step===sequence.length){reveal();return;}
    const [name,ms]=sequence[step];
    phase(name,ms);after(ms,()=>play(step+1));
  }
  if(motion.matches){reveal();return;}
  play(0);
}
function resolveMatches(){
  if(matches.length===0){fail('请核对序列号，也可以只输入编号中的数字再试。');return;}
  if(matches.length===1){choose(matches[0]);return;}
  phase('choices');
  const list=byId('list');list.textContent='';
  for(const row of matches){
    const button=document.createElement('button');
    button.type='button';button.textContent=row.id+' · '+row.title;
    button.addEventListener('click',()=>choose(row));list.appendChild(button);
  }
  byId('options').querySelector('h2').focus();
}
function begin(direct){
  clearQuery();fast=direct;
  const term=field.value.trim().toLowerCase();
  if(!term){fail('请先输入壁纸序列号。');field.focus();return;}
  const exact=catalog.find(row=>row.id.toLowerCase()===term);
  matches=exact?[exact]:catalog.filter(row=>row.id.toLowerCase().includes(term)||row.title.toLowerCase().includes(term));
  field.blur();
  if(direct){resolveMatches();return;}
  phase('search');after(550,resolveMatches);
}
form.addEventListener('submit',event=>{
  event.preventDefault();
  if(primary.disabled)return;
  begin(false);
});
quick.addEventListener('click',()=>{
  if(state==='done'){byId('name').focus();return;}
  if(selected){reveal();return;}
  if(state==='search'||state==='choices'){cancel();fast=true;resolveMatches();return;}
  begin(true);
});
function edited(key,composing=false){
  clearQuery();
  if(key)stationScene.tap(key);
  const term=field.value.trim().toLowerCase();
  if(term)byId('message').textContent='完整编号可自动取货，也可按确认键查询';
  if(!composing && catalog.some(r=>r.id.toLowerCase()===term)){
    const run=version;
    timer=setTimeout(()=>{if(run===version)begin(false);},900);
  }
}
field.addEventListener('input',e=>edited(e.inputType?.startsWith('delete')?'⌫':(e.data||field.value).slice(-1),e.isComposing));
field.addEventListener('compositionend',()=>edited(field.value.slice(-1)));
stationScene.keys.forEach(key=>{
  const button=document.createElement('button');
  button.type='button';button.textContent=key;button.setAttribute('aria-label',key==='⌫'?'退格':'输入 '+key);
  button.addEventListener('click',()=>{
    const a=field.selectionStart??field.value.length,b=field.selectionEnd??a;
    const start=key==='⌫'&&a===b?Math.max(0,a-1):a;
    field.setRangeText(key==='⌫'?'':key,start,b,'end');
    edited(key);
  });
  byId('pad').appendChild(button);
});
byId('back').addEventListener('click',()=>{clearQuery();field.focus();});
byId('reset').addEventListener('click',()=>{field.value='';clearQuery();field.focus();});
byId('copy').addEventListener('click',async()=>{
  if(!selected)return;
  const run=version;
  try {
    await navigator.clipboard.writeText(selected.link);
    if(run===version)byId('feedback').textContent='链接已复制。';
  } catch {
    if(run!==version)return;
    byId('manual').hidden=false;byId('url').focus();byId('url').select();
  }
});
phase('idle');
